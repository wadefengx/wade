name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: darwin
            arch: amd64
            ext: tar.gz
          - os: darwin
            arch: arm64
            ext: tar.gz
          - os: linux
            arch: amd64
            ext: tar.gz
          - os: linux
            arch: arm64
            ext: tar.gz
          - os: windows
            arch: amd64
            ext: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o wade${{ matrix.os == 'windows' && '.exe' || '' }} .

      - name: Package (tar.gz)
        if: matrix.ext == 'tar.gz'
        run: tar czf wade-${{ matrix.os }}-${{ matrix.arch }}.tar.gz wade

      - name: Package (zip)
        if: matrix.ext == 'zip'
        run: zip wade-${{ matrix.os }}-${{ matrix.arch }}.zip wade.exe

      - name: Checksum
        run: shasum -a 256 wade-${{ matrix.os }}-${{ matrix.arch }}.${{ matrix.ext }} > wade-${{ matrix.os }}-${{ matrix.arch }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wade-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            wade-${{ matrix.os }}-${{ matrix.arch }}.${{ matrix.ext }}
            wade-${{ matrix.os }}-${{ matrix.arch }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Stage installer
        run: cp scripts/install.sh install.sh

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: "wade ${{ github.ref_name }}"
          files: |
            wade-*/*
            install.sh
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout templates
        uses: actions/checkout@v4

      - name: Update Homebrew and Scoop manifests
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          bash scripts/release-shas.sh --update

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/wadefengx/homebrew-tap.git" homebrew-tap
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/wadefengx/scoop-wade.git" scoop-wade

          cp scripts/wade.rb homebrew-tap/wade.rb
          cp scripts/wade.json scoop-wade/wade.json

          if ! git -C homebrew-tap diff --quiet; then
            git -C homebrew-tap add wade.rb
            git -C homebrew-tap commit -m "chore: update wade ${version}"
            git -C homebrew-tap push origin main
          fi

          if ! git -C scoop-wade diff --quiet; then
            git -C scoop-wade add wade.json
            git -C scoop-wade commit -m "chore: update wade ${version}"
            git -C scoop-wade push origin main
          fi
